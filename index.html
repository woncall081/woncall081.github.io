<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071a12">
  <title>Samudio Agency Gridiron Cup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div class="eyebrow">SAMUDIO AGENCY</div>
      <h1>GRIDIRON <span>CUP</span></h1>
      <p id="date" class="date">Loading today’s games…</p>
      <nav class="nav" aria-label="Scoreboard sections">
        <a href="#standings">Standings</a><a href="#results">Results</a><a href="#schedule">Schedule</a>
      </nav>
    </header>
    <section id="live">
      <div class="heading"><div><p class="kicker">LIVE BOARD</p><h2>Today’s Matchups</h2></div><div id="updated" class="pill">Pre-game</div></div>
      <div id="games" class="grid"></div>
    </section>
    <section id="standings" class="standings">
      <div class="heading"><div><p class="kicker">THE RACE</p><h2>Team Records</h2></div></div>
      <div class="table"><table><thead><tr><th>Rank</th><th>Team</th><th>Record</th></tr></thead><tbody id="records"></tbody></table></div>
    </section>
    <section id="results" class="results">
      <div class="heading"><div><p class="kicker">FINAL WHISTLE</p><h2>Results</h2></div></div>
      <div class="table"><table><thead><tr><th>Date</th><th>Matchup</th><th>Final Result</th></tr></thead><tbody id="results-body"></tbody></table></div>
    </section>
    <section id="schedule" class="schedule">
      <div class="heading"><div><p class="kicker">UP NEXT</p><h2>Remaining Schedule</h2></div></div>
      <div class="table"><table><thead><tr><th>Date</th><th>Matchup</th></tr></thead><tbody id="schedule-body"></tbody></table></div>
    </section>
  </main>
  <footer>THE SAMUDIO AGENCY GRIDIRON CUP · 2026</footer>
  <script type="module" src="./app.js"></script>
</body>
</html>
