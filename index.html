<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071a12">
<title>Samudio Agency Gridiron Cup</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--ink:#f4f0df;--muted:#9eb1a7;--gold:#f4b942;--line:#ffffff1f}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:Inter,sans-serif;background:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px),radial-gradient(circle at 50% 0,#164d32,#06150e 48%,#030a07);background-size:32px 32px,32px 32px,auto}.shell{width:min(1100px,calc(100% - 32px));margin:auto;padding:42px 0 64px}.hero{text-align:center;padding:44px 16px 54px}.eyebrow,.kicker{margin:0 0 8px;color:var(--gold);font-size:.75rem;font-weight:800;letter-spacing:.28em}.hero h1{margin:0;font:italic 800 clamp(4.5rem,14vw,9.5rem)/.78 'Barlow Condensed';letter-spacing:-.045em;text-shadow:0 8px 40px #0006}.hero h1 span{color:transparent;-webkit-text-stroke:2px var(--gold)}.date{margin:26px 0 0;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}.heading{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:18px}h2{margin:0;font:800 clamp(2rem,5vw,3.2rem) 'Barlow Condensed';text-transform:uppercase}.pill{border:1px solid var(--line);border-radius:999px;padding:8px 14px;color:var(--muted);font-size:.78rem;font-weight:700;text-transform:uppercase}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.card{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:22px;padding:22px;background:linear-gradient(145deg,#18422feb,#071810f5);box-shadow:0 22px 60px #0005}.card:after{content:'';position:absolute;width:180px;height:180px;right:-70px;top:-80px;border:28px solid #f4b94212;border-radius:50%}.status{display:flex;align-items:center;gap:8px;margin:0 0 24px;color:var(--muted);font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.status i{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold)}.team{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px}.team h3{margin:0;font:800 clamp(1.5rem,3.5vw,2.35rem)/1 'Barlow Condensed';text-transform:uppercase}.score{grid-row:1/3;grid-column:2;min-width:56px;font:800 3.4rem/1 'Barlow Condensed';text-align:right}.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}.stat{border:1px solid var(--line);border-radius:999px;padding:5px 9px;color:var(--muted);font-size:.68rem;font-weight:700;letter-spacing:.03em}.stat b{color:var(--ink)}.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:16px 0;color:var(--muted);font-size:.65rem}.vs span{height:1px;background:var(--line)}.standings{margin-top:48px}.table{overflow:hidden;border:1px solid var(--line);border-radius:20px;background:#05140dc2}table{width:100%;border-collapse:collapse}th,td{padding:17px 22px;text-align:left;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase}tr:last-child td{border-bottom:0}th:last-child,td:last-child{text-align:right}.rank{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#ffffff0f;color:var(--muted);font-weight:800}.team-name{display:block}.players{display:block;margin-top:4px;color:var(--muted);font-size:.75rem;font-weight:500}.record{font:800 1.65rem 'Barlow Condensed';color:var(--gold)}.empty{grid-column:1/-1;border:1px dashed var(--line);border-radius:20px;padding:50px;text-align:center;color:var(--muted)}footer{padding:24px;border-top:1px solid var(--line);color:#6f8479;font-size:.68rem;font-weight:700;letter-spacing:.16em;text-align:center}@media(max-width:720px){.shell{width:calc(100% - 20px);padding-top:18px}.hero{padding:34px 8px 42px}.grid{grid-template-columns:1fr}.team h3{font-size:1.5rem}.score{font-size:2.8rem}th,td{padding:14px 12px}.players{max-width:180px}}
</style>
</head>
<body><main class="shell"><header class="hero"><div class="eyebrow">SAMUDIO AGENCY</div><h1>GRIDIRON <span>CUP</span></h1><p id="date" class="date">Loading today’s games…</p></header><section><div class="heading"><div><p class="kicker">LIVE BOARD</p><h2>Today’s Matchups</h2></div><div id="updated" class="pill">Pre-game</div></div><div id="games" class="grid"></div></section><section class="standings"><div class="heading"><div><p class="kicker">THE RACE</p><h2>Team Records</h2></div></div><div class="table"><table><thead><tr><th>Rank</th><th>Team</th><th>Record</th></tr></thead><tbody id="records"></tbody></table></div></section></main><footer>THE SAMUDIO AGENCY GRIDIRON CUP · 2026</footer>
<script type="module">
const labels={"Show Me Your TDs":"Show Me Your TD's","Winning Will & Bryan":"WWB's","Belt to Ass":"BTA's","Chris Davis":"Chris's"};
const denverDate=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Denver',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
function schedule(teams){const pairs=[[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]],out=[],d=new Date('2026-09-22T12:00:00Z'),end=new Date('2026-10-15T12:00:00Z');let n=0;while(d<=end){if(![0,6].includes(d.getUTCDay())){const date=d.toISOString().slice(0,10);for(const[h,a]of pairs[n%3])out.push({date,home:teams[h],away:teams[a],homeScore:null,awayScore:null,final:false});n++}d.setUTCDate(d.getUTCDate()+1)}return out}
function records(teams,games){const r=new Map(teams.map(t=>[t,{team:t,w:0,l:0,t:0}]));for(const g of games){if(g.final!==true||!Number.isFinite(g.homeScore)||!Number.isFinite(g.awayScore))continue;const h=r.get(g.home),a=r.get(g.away);if(g.homeScore===g.awayScore){h.t++;a.t++}else if(g.homeScore>g.awayScore){h.w++;a.l++}else{a.w++;h.l++}}return[...r.values()].map(x=>({...x,record:`${x.w}-${x.l}${x.t?`-${x.t}`:''}`}))}
const pct=v=>Number.isFinite(v)?`${v.toFixed(1)}%`:'—';
function teamLine(name,score,followup,ricochet){return `<div class="team"><h3>${labels[name]}</h3><div class="stats"><span class="stat">Follow-up <b>${pct(followup)}</b></span><span class="stat">Ricochet <b>${ricochet??0}</b></span></div><div class="score">${score??0}</div></div>`}
function card(g){const pending=g.homeScore===null||g.awayScore===null,status=g.final?'Final':pending?'Awaiting update':'Live score';return `<article class="card"><p class="status"><i></i>${status}</p>${teamLine(g.home,g.homeScore,g.homeFollowupPct,g.homeRicochetCalls)}<div class="vs"><span></span><b>VS</b><span></span></div>${teamLine(g.away,g.awayScore,g.awayFollowupPct,g.awayRicochetCalls)}</article>`}
async function load(){const data=await fetch(`data.json?v=${Date.now()}`,{cache:'no-store'}).then(r=>r.json()),teams=data.teams.map(t=>t.name),teamInfo=new Map(data.teams.map(t=>[t.name,t])),overrides=new Map(data.games.map(g=>[`${g.date}|${g.home}|${g.away}`,g])),games=schedule(teams).map(g=>({...g,...overrides.get(`${g.date}|${g.home}|${g.away}`)})),today=denverDate(),todayGames=games.filter(g=>g.date===today),standings=records(teams,games).sort((a,b)=>b.w-a.w||a.l-b.l||b.t-a.t||a.team.localeCompare(b.team));document.querySelector('#date').textContent=new Intl.DateTimeFormat('en-US',{timeZone:'UTC',weekday:'long',month:'long',day:'numeric',year:'numeric'}).format(new Date(`${today}T12:00:00Z`));document.querySelector('#games').innerHTML=todayGames.length?todayGames.map(card).join(''):'<div class="empty">No games scheduled today.</div>';document.querySelector('#records').innerHTML=standings.map((r,i)=>`<tr><td><span class="rank">${i+1}</span></td><td><strong class="team-name">${labels[r.team]}</strong><span class="players">${teamInfo.get(r.team)?.players??''}</span></td><td><span class="record">${r.record}</span></td></tr>`).join('');document.querySelector('#updated').textContent=data.updatedAt?`Updated ${new Intl.DateTimeFormat('en-US',{timeZone:'America/Denver',hour:'numeric',minute:'2-digit'}).format(new Date(data.updatedAt))}`:'Pre-game'}
load().catch(()=>document.querySelector('#games').innerHTML='<div class="empty">Scoreboard temporarily unavailable.</div>');setInterval(load,60000);
</script></body></html>
